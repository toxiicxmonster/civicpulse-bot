name: CivicPulse Bot

on:
  workflow_dispatch:          # manual trigger only — bot runs continuously on Render

jobs:
  run-bot:
    runs-on: ubuntu-latest
    permissions:
      contents: write         # needed to commit posted.json back

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run bot (single-run mode)
        env:
          CONGRESS_API_KEY:  ${{ secrets.CONGRESS_API_KEY }}
          X_API_KEY:         ${{ secrets.X_API_KEY }}
          X_API_SECRET:      ${{ secrets.X_API_SECRET }}
          X_ACCESS_TOKEN:    ${{ secrets.X_ACCESS_TOKEN }}
          X_ACCESS_SECRET:   ${{ secrets.X_ACCESS_SECRET }}
          DRY_RUN:           'false'
        run: node src/bot.js --single-run

      - name: Commit updated posted.json
        run: |
          git config user.name  "CivicPulse Bot"
          git config user.email "bot@civicpulse.app"
          git add data/posted.json
          git diff --staged --quiet || git commit -m "chore: update posted.json [skip ci]"
          git push
