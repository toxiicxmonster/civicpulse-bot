services:
  - type: worker
    name: civicpulse-bot
    runtime: node
    nodeVersion: 20.19.2
    buildCommand: npm install
    startCommand: node src/bot.js
    disk:
      name: bot-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: NODE_ENV
        value: production
      - key: DATA_DIR
        value: /data
      - key: POLL_INTERVAL_MINUTES
        value: 15
      - key: DRY_RUN
        value: false
      - key: VOTE_IMAGE
        value: true
      - key: CONGRESS_API_KEY
        sync: false
      - key: X_API_KEY
        sync: false
      - key: X_API_SECRET
        sync: false
      - key: X_ACCESS_TOKEN
        sync: false
      - key: X_ACCESS_SECRET
        sync: false
      - key: TS_ACCESS_TOKEN
        sync: false
      - key: BSKY_HANDLE
        sync: false
      - key: BSKY_APP_PASSWORD
        sync: false
